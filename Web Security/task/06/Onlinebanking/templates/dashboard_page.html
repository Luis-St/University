<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h2>Hallo {{user}}</h2>
        <p>Kontostand: {{balance}} €</p>

        <h3>Geld überweisen</h3>
        <form method="POST" action="/transfer">
            <input type="hidden" name="csrf_token" value="{{csrf_token}}">
            <input type="text" name="to" placeholder="Empfänger" required><br>
            <input type="number" name="amount" placeholder="Betrag" required><br>
            <button type="submit">Überweisung tätigen</button>
        </form>

        <br>
        <a href="/logout">Logout</a>
    </div>
</body>
</html>
